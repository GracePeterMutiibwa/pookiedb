site_name: PookieDB
site_url: https://pookiedb.readthedocs.io/
repo_url: https://github.com/GracePeterMutiibwa/pookiedb
repo_name: GracePeterMutiibwa/pookiedb

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy # Adds a copy button to your code blocks!

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences